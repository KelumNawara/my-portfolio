<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelum Nawarathne | Creative Director & Brand Strategist</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        
        body { 
            background-color: #FFFFFF; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-top: 60px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(12, 106, 112, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-logo { color: #ffffff; font-weight: 600; font-size: 1rem; text-decoration: none; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { color: rgba(255, 255, 255, 0.8); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: #ffffff; }

        .portfolio-container { 
            width: 100%; 
            max-width: 1200px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            padding: 16px;
        }

        .page-wrapper { 
            width: 100%; 
            position: relative; 
            line-height: 0; 
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        /* Background color for the first 3 pages */
        .portfolio-container .page-wrapper:nth-child(1),
        .portfolio-container .page-wrapper:nth-child(2),
        .portfolio-container .page-wrapper:nth-child(3) {
            background-color: #0c6a70;
        }

        .page-wrapper.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .portfolio-page { 
            width: 100%; 
            height: auto; 
            display: block; 
            border-radius: 6px;
            box-shadow: none;
        }
        
        /* Relative hotspot styling ensures links scale proportionally with the image size on mobile */
        .contact-link { position: absolute; background: rgba(255, 255, 255, 0); display: block; z-index: 10; }
        .whatsapp { bottom: 32%; left: 33%; width: 16%; height: 6%; }
        .email { bottom: 32%; left: 50%; width: 23%; height: 6%; }

        /* Responsive Mobile Tweak for Navigation text layouts */
        @media (max-width: 480px) {
            header { padding: 0 16px; }
            .nav-logo { font-size: 0.85rem; }
            .nav-links { gap: 12px; }
            .nav-links a { font-size: 0.8rem; }
            .portfolio-container { gap: 8px; padding: 8px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="nav-logo">KELUM NAWARATHNE</a>
        <ul class="nav-links">
            <li><a href="#how-i-think">Approach</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </header>

    <div class="portfolio-container">
        <div class="page-wrapper"><img class="portfolio-page" src="page1.jpg" alt="Creative Portfolio Cover"></div>
        <div id="how-i-think" class="page-wrapper"><img class="portfolio-page" src="page2.jpg" alt="How I think"></div>
        <div id="projects" class="page-wrapper"><img class="portfolio-page" src="page3.jpg" alt="Selected Projects"></div>
        <div class="page-wrapper"><img class="portfolio-page" src="page4.jpg" alt="Investein Project"></div>
        <div class="page-wrapper"><img class="portfolio-page" src="page5.jpg" alt="Thummodara Nature Oasis"></div>
        <div class="page-wrapper"><img class="portfolio-page" src="page6.jpg" alt="DOMA Project"></div>
        <div class="page-wrapper"><img class="portfolio-page" src="page7.jpg" alt="Avenger Tractors"></div>
        <div class="page-wrapper"><img class="portfolio-page" src="page8.jpg" alt="NPP Campaign"></div>
        <div class="page-wrapper"><img class="portfolio-page" src="page9.jpg" alt="SED Bureau"></div>
        <div class="page-wrapper"><img class="portfolio-page" src="page10.jpg" alt="Emberew Ceylon Black Tea"></div>
        <div class="page-wrapper"><img class="portfolio-page" src="page11.jpg" alt="Ananda Rice and Wajira Nursery"></div>
        <div class="page-wrapper"><img class="portfolio-page" src="page12.jpg" alt="Additional Work - Drama Magazine"></div>
        <div class="page-wrapper"><img class="portfolio-page" src="page13.jpg" alt="Logo Design and Menu Design"></div>
        <div class="page-wrapper"><img class="portfolio-page" src="page14.jpg" alt="Down Town Pulse 2024"></div>
        <div class="page-wrapper"><img class="portfolio-page" src="page15.jpg" alt="Book Covers"></div>
        
        <div id="contact" class="page-wrapper">
            <img class="portfolio-page" src="page16.jpg" alt="Contact Kelum Nawarathne">
            <a href="https://wa.me" target="_blank" class="contact-link whatsapp" title="Chat on WhatsApp"></a>
            <a href="mailto:kelumnawarathne@gmail.com" class="contact-link email" title="Send Email"></a>
        </div>
    </div>

    <script>
        const pages = document.querySelectorAll('.page-wrapper');
        const observerOptions = { root: null, rootMargin: '0px', threshold: 0.05 };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        pages.forEach(page => { observer.observe(page); });
    </script>

</body>
</html>
